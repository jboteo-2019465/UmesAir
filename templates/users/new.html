{% extends 'base.html' %}

{% block title %}Agregar Nuevo Usuario - UMES Air{% endblock %}

{% block content %}
<div class="container my-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Panel</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('list_users') }}">Usuarios</a></li>
            <li class="breadcrumb-item active" aria-current="page">Agregar Nuevo Usuario</li>
        </ol>
    </nav>
    
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">Agregar Nuevo Usuario</h4>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ customer_data.name if customer_data else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ customer_data.email if customer_data else '' }}" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="role" class="form-label">Rol</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="">Seleccionar un rol</option>
                            <option value="admin">Administrador</option>
                            <option value="agent">Agente de Boletos</option>
                            <option value="passenger">Pasajero</option>
                        </select>
                    </div>
                </div>
                
                <div class="mt-4 d-flex justify-content-between">
                    <a href="{{ url_for('list_users') }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Crear Usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
